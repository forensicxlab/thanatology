name: Build desktop bundles

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            artifact: thanatology-macos-aarch64
          - name: Windows x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: thanatology-windows-x64
          - name: Linux x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            artifact: thanatology-linux-x64

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Verify MUI X license key
        env:
          VITE_MUI_X_LICENSE_KEY: ${{ secrets.MUI_X_LICENSE_KEY }}
        run: node -e "if ((process.env.VITE_MUI_X_LICENSE_KEY || '').trim().length === 0) { console.error('MUI_X_LICENSE_KEY repository secret is not configured.'); process.exit(1); }"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libudev-dev \
            libusb-1.0-0-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            xdg-utils

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify LeechCore resources
        run: node scripts/verify-leechcore-resources.mjs ${{ matrix.target }}

      - name: Ad-hoc sign nested macOS libraries
        if: runner.os == 'macOS'
        run: |
          codesign --force --sign - --timestamp=none src-tauri/resources/leechcore/aarch64-apple-darwin/leechcore_ft601_driver_macos.dylib
          codesign --force --sign - --timestamp=none src-tauri/resources/leechcore/aarch64-apple-darwin/libftd3xx.dylib
          codesign --verify --strict src-tauri/resources/leechcore/aarch64-apple-darwin/leechcore_ft601_driver_macos.dylib
          codesign --verify --strict src-tauri/resources/leechcore/aarch64-apple-darwin/libftd3xx.dylib

      - name: Build desktop bundles
        id: build
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
          VITE_MUI_X_LICENSE_KEY: ${{ secrets.MUI_X_LICENSE_KEY }}
        with:
          args: --verbose --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci -- --locked

      - name: Upload desktop bundles
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: warn
          compression-level: 0
