[package]
name = "thanatology"
version = "0.1.0"
description = "The Thanatology Desktop Application"
authors = ["k1nd0ne"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "thanatology_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"

exhume_body = { path = "../../exhume/members/exhume_body" }
exhume_partitions = { path = "../../exhume/members/exhume_partitions" }
exhume_lvm = { path = "../../exhume/members/exhume_lvm" }
exhume_filesystem = { path = "../../exhume/members/exhume_filesystem" }
exhume_artefacts = { path = "../../exhume/members/exhume_artefacts" }
exhume_indexer = { path = "../../exhume/members/exhume_indexer" }
exhume_memory = { path = "../../exhume/members/exhume_memory" }
exhume_agent = { path = "../../exhume/members/exhume_agent", default-features = false }
env_logger = "0.10"
log = "0.4"
file_type = "0.8.8"

tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "regexp",
] }
futures = "0.3.31"
tauri-plugin-mcp-bridge = "0.11"
tauri-plugin-shell = "2"
tauri-plugin-pty = "0.1.0"
tauri-plugin-os = "2.3.0"
tauri-plugin-macos-permissions = "2.3.0"
regex = "1.12.2"
anyhow = "1.0.100"
sha2 = "0.10.9"
md-5 = "0.10.6"
rig-core = "0.31.0"
thiserror = "2.0.18"
base64 = "0.22.1"
reqwest = { version = "0.13.2", features = ["multipart", "stream", "json"] }
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
plist = { version = "=1.7.0", features = ["enable_unstable_features_that_may_break_with_minor_version_bumps"] }
fs2 = "0.4.3"
zip = { version = "7.4.0", default-features = false, features = ["deflate"] }

[patch.crates-io]
# DEV ONLY: keep crates.io consumers on the sibling forensicxlab checkout.
# RELEASE AFTER PUSH: remove this override after every manifest uses an
# immutable forensicxlab Git `rev`.
memflow = { path = "../../memflow-framework/memflow/memflow" }
exhume_artefacts  = { path = "../../exhume/members/exhume_artefacts" }
exhume_body       = { path = "../../exhume/members/exhume_body" }
exhume_filesystem = { path = "../../exhume/members/exhume_filesystem" }
exhume_partitions = { path = "../../exhume/members/exhume_partitions" }
exhume_extfs      = { path = "../../exhume/members/exhume_extfs" }
exhume_exfat      = { path = "../../exhume/members/exhume_exfat" }
exhume_lvm        = { path = "../../exhume/members/exhume_lvm" }
exhume_ntfs       = { path = "../../exhume/members/exhume_ntfs" }
exhume_apfs       = { path = "../../exhume/members/exhume_apfs" }
exhume_indexer    = { path = "../../exhume/members/exhume_indexer" }
exhume_memory     = { path = "../../exhume/members/exhume_memory" }

# DEV ONLY: connector forks still declare the forensicxlab Git source.
# Patching that source prevents a second, type-incompatible memflow instance.
[patch."https://github.com/forensicxlab/memflow"]
memflow = { path = "../../memflow-framework/memflow/memflow" }
